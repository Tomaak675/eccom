# Short MQTT smoke test against a remote receiver (run with --hosts). The
# runner starts a mosquitto container on the broker host (hosts file broker
# section) and removes it afterwards.
name: mqtt_smoke_remote

topology:
  sender: edge
  receiver: cloud

protocol:
  type: mqtt
  mqtt:
    endpoint:
      host: cloud            # the broker runs on this role (hosts file broker.run_on)
      port: 1883
    client:
      qos: 1
      timeout_s: 5

payload:
  size_bytes: 1024
  content: zeros

load:
  mode: constant_rate
  messages_per_second: 20
  duration_s: 10
  concurrency: 5

receiver:
  artificial_processing_delay_ms: 0
  control_port: 8081
  control_bind_host: 0.0.0.0

experiment:
  warmup_s: 2
  cooldown_s: 1

instrumentation:
  system_metrics: true
  system_metrics_interval_s: 1.0
