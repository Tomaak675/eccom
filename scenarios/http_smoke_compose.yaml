# Short smoke test for the Docker Compose deployment (~15 s):
#   SCENARIO=http_smoke_compose.yaml RUN_ID=smoke docker compose up --build --exit-code-from edge
name: http_smoke_compose

topology:
  sender: edge
  receiver: cloud

protocol:
  type: http
  http:
    endpoint:
      host: cloud
      port: 8080
    client:
      keep_alive: true
      timeout_s: 5
    server:
      bind_host: 0.0.0.0

payload:
  size_bytes: 1024
  content: zeros

load:
  mode: constant_rate
  messages_per_second: 50
  duration_s: 10
  concurrency: 5

receiver:
  artificial_processing_delay_ms: 0
  control_port: 8081
  control_bind_host: 0.0.0.0

experiment:
  warmup_s: 2
  cooldown_s: 1

instrumentation:
  system_metrics: true
  system_metrics_interval_s: 1.0
