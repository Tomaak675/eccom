# scenario6: how many referential smart homes one edge gateway (one Python
# sender process) forwards through each protocol variant to the Go receiver,
# and how batching moves that ceiling. The home (camera excluded): 4 lights,
# 40 smart plugs, 4 temperature and 4 motion sensors at 1 Hz (4/16/4/4 B), 4
# microphones at 50 Hz x 640 B and 4 mmWave sensors at 10 Hz x 20 B = 60
# devices, 292 msg/s, ~129.5 kB/s per home (the microphones are 68 % of the
# messages and 99 % of the bytes). Aggregation factor k batches the readings
# of one sensor slot across k homes into one message, so the message rate
# falls k-fold while the byte rate stays. The ramp adds k homes per 10 s step
# with a 10 s drain pause between steps, 12 steps (k -> 12k homes, i.e. 292 ->
# 3 504 msg/s for every k), up to 10 000 sends in flight; the per-step table
# (summary.json "ramp", plots/ramp_over_time.png) locates the knee in homes.
# Identical traffic in every file of a factor; only the protocol block differs
# between variants and only the factor between the x1/x2/x4/x8 files. See
# docs/scenario-parameters.md. Run the whole suite:
#   eccom run scenarios/scenario6 --hosts hosts/<your-hosts>.yaml --pause-s 30 --no-analyze
# HTTP baseline. The connection pool is bounded (250 connections): a stall
# queues inside the client instead of dialling new connections.
name: s6_http_x1
interaction: one_way

topology:
  sender: edge
  receiver: cloud

home:                          # the referential smart home, camera excluded
  seed: 42
  sensors:
    - { type: light,       count: 4,  rate_hz: 1,  size_bytes: 4 }
    - { type: smart_plug,  count: 40, rate_hz: 1,  size_bytes: 16 }
    - { type: temperature, count: 4,  rate_hz: 1,  size_bytes: 4 }
    - { type: motion,      count: 4,  rate_hz: 1,  size_bytes: 4 }
    - { type: microphone,  count: 4,  rate_hz: 50, size_bytes: 640 }
    - { type: mmwave,      count: 4,  rate_hz: 10, size_bytes: 20 }

load:
  mode: homes
  homes: 1                     # first step: one batch of homes per sensor slot = 292 msg/s
  homes_increment: 1           # one more batch per step: +292 msg/s per step for every factor
  aggregation_factor: 1        # readings of one sensor slot across this many homes travel as one message
  step_duration_s: 10
  step_pause_s: 10             # quiet gap after every step: the backlog drains, the next step starts empty
  duration_s: 120              # 12 steps of sending: 1 -> 12 homes, 292 -> 3504 msg/s
  concurrency: 10000           # sized so it never limits the schedule; the HTTP pool and the MQTT window are the caps

receiver:
  artificial_processing_delay_ms: 0
  control_port: 8081
  control_bind_host: 0.0.0.0
  implementation: go           # a Python agent is one event loop on one core; the Go receiver uses every core

experiment:
  warmup_s: 5                  # the ramp truncated to its first step
  cooldown_s: 10               # lets the receiver drain its backlog before shutdown

instrumentation:
  system_metrics: true
  system_metrics_interval_s: 1.0
  link_capacity: true          # iperf3 both ways before the run: records the uplink capacity next to the x4/x8 byte rates

protocol:
  type: http
  tcp_nodelay: true           # Nagle off on every socket (the default; explicit so the run records it)
  http:
    endpoint:
      host: cloud
      port: 8080
    client:
      keep_alive: true
      timeout_s: 5
      max_connections: 250    # bounded pool: a backlog waits for a free connection instead of dialling
    server:
      bind_host: 0.0.0.0
