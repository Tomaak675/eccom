# HTTPS smoke test: same adapter as HTTP, TLS composed via config.
# Generate self-signed certs first (paths are relative to this file):
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout scenarios/certs/server-key.pem -out scenarios/certs/server.pem \
#     -days 365 -subj "//CN=eccom" -addext "subjectAltName=IP:127.0.0.1"
name: https_smoke

topology:
  sender: edge
  receiver: cloud

protocol:
  type: http
  http:
    endpoint:
      host: 127.0.0.1
      port: 8443
    client:
      keep_alive: true
      timeout_s: 5
    server:
      bind_host: 127.0.0.1
  tls:
    enabled: true
    cert_file: certs/server.pem
    key_file: certs/server-key.pem
    ca_file: certs/server.pem   # verify against the self-signed cert; omit to skip verification

payload:
  size_bytes: 1024
  content: zeros

load:
  mode: constant_rate
  messages_per_second: 50
  duration_s: 10
  concurrency: 5

receiver:
  artificial_processing_delay_ms: 0
  control_port: 8081

experiment:
  warmup_s: 2
  cooldown_s: 1

instrumentation:
  system_metrics: true
