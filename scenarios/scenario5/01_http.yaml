# scenario5: scenario4's protocol matrix with the Go sender. One Go process
# paces the whole schedule over six cores of the sender's host
# (sender.threads: 6, which also caps its container at docker --cpus 6)
# where scenario4 runs six Python processes, against the same Go receiver,
# under a steeper linear ramp meant to reach the uplink's capacity:
# 2400 msg/s + 2400 per 10 s step, 18 steps (2400 -> 43200 msg/s), a 10 s
# pause after every step, 32 B random payload, 10 000 in flight. Every step
# up to 14400 is also one of scenario4's offered rates, so the two suites
# compare at shared rates. scenario4's per-process knobs are whole-process
# here: concurrency 10 000 is the total and stays, the bounded HTTP pool
# becomes 1500 (= 6 x 250), one MQTT connection carries all traffic where
# scenario4 has six. The connection pool is unbounded in this file
# (client.max_connections: 0); see 09 for the bounded twin.
# Identical traffic in every file; only the protocol block differs.
#   eccom run scenarios/scenario5 --hosts hosts/<your-hosts>.yaml --pause-s 30
name: s5_http
interaction: one_way

topology:
  sender: edge
  receiver: cloud

payload:
  size_bytes: 32
  content: random
  seed: 42

load:
  mode: ramp
  messages_per_second: 2400    # first step; also one of scenario4's offered rates
  rate_increment: 2400         # +2400 msg/s per step (4 x scenario4's 600): every step up to 14400 is one of scenario4's rates
  step_duration_s: 10
  step_pause_s: 10             # quiet gap after every step: the backlog drains, the next step starts empty
  duration_s: 180              # 18 steps of sending: 2400 -> 43200 msg/s
  concurrency: 10000           # whole process (scenario4 splits the same 10 000 over six); sized so it never limits the schedule
  senders: 1                   # one Go process; its parallelism is sender.threads

sender:
  implementation: go           # one process pacing the schedule over `threads` goroutines; a Python sender needs a process per core
  threads: 6                   # GOMAXPROCS, pacing goroutines and the container's docker --cpus cap (sender.cpus overrides); leave some cores free for the kernel, dockerd and sshd

receiver:
  artificial_processing_delay_ms: 0
  control_port: 8081
  control_bind_host: 0.0.0.0
  implementation: go           # as in scenario4: uses every core of the receiver's host

experiment:
  warmup_s: 5                  # the ramp truncated to its first step
  cooldown_s: 10               # lets the receiver drain its backlog before shutdown

instrumentation:
  system_metrics: true
  system_metrics_interval_s: 1.0
  link_capacity: true          # iperf3 both ways before the run: the uplink's capacity

protocol:
  type: http
  tcp_nodelay: true           # Nagle off on every socket (the default; explicit so the run records it)
  http:
    endpoint:
      host: cloud
      port: 8080
    client:
      keep_alive: true
      timeout_s: 5
    server:
      bind_host: 0.0.0.0
