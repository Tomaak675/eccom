# Baseline experiment for Docker Compose: the sender reaches the receiver via
# the compose service name "cloud"; servers bind all interfaces inside
# containers.
name: http_request_response_baseline_compose

topology:
  sender: edge
  receiver: cloud

protocol:
  type: http
  http:
    endpoint:
      host: cloud
      port: 8080
    client:
      keep_alive: true
      timeout_s: 5
    server:
      bind_host: 0.0.0.0

payload:
  size_bytes: 1024
  content: zeros

load:
  mode: constant_rate
  messages_per_second: 100
  duration_s: 60
  concurrency: 10

receiver:
  artificial_processing_delay_ms: 0
  control_port: 8081
  control_bind_host: 0.0.0.0   # the edge container probes the clock via this port

experiment:
  warmup_s: 10
  cooldown_s: 5

instrumentation:
  system_metrics: true
  system_metrics_interval_s: 1.0
