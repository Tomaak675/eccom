# scenario1: baseline latency (128 B random payload, 1 msg/s x 60 s).
# See 01_http.yaml.
# Identical traffic in every file; only the protocol block differs.
#
# Connection-reuse variant of 01_http: keep_alive: false makes the adapter
# set force_close on the aiohttp connector, so EVERY message opens a fresh
# TCP connection (plus a TLS handshake if tls were enabled). Compare its
# send-ack against 01_http to price connection setup per message.
name: s1_http_no_keepalive
interaction: one_way

topology:
  sender: edge
  receiver: cloud

payload:
  size_bytes: 128
  content: random
  seed: 42

load:
  mode: constant_rate
  messages_per_second: 1
  duration_s: 60
  concurrency: 1

receiver:
  artificial_processing_delay_ms: 0
  control_port: 8081
  control_bind_host: 0.0.0.0

experiment:
  warmup_s: 5
  cooldown_s: 2

instrumentation:
  system_metrics: true
  system_metrics_interval_s: 1.0

protocol:
  type: http
  http:
    endpoint:
      host: cloud
      port: 8080
    client:
      keep_alive: false
      timeout_s: 5
    server:
      bind_host: 0.0.0.0
