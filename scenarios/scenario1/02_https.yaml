# scenario1: baseline latency (128 B random payload, 1 msg/s x 60 s).
# See 01_http.yaml.
# Identical traffic in every file; only the protocol block differs.
#
# TLS variant of 01_http: the same exchange over one keep-alive TLS
# connection, so the handshake is paid once per run and the gap against 01
# is TLS record processing per message.
name: s1_https
interaction: one_way

topology:
  sender: edge
  receiver: cloud

payload:
  size_bytes: 128
  content: random
  seed: 42

load:
  mode: constant_rate
  messages_per_second: 1
  duration_s: 60
  concurrency: 1

receiver:
  artificial_processing_delay_ms: 0
  control_port: 8081
  control_bind_host: 0.0.0.0

experiment:
  warmup_s: 5
  cooldown_s: 2

instrumentation:
  system_metrics: true
  system_metrics_interval_s: 1.0

protocol:
  type: http
  http:
    endpoint:
      host: cloud
      port: 8443
    client:
      keep_alive: true
      timeout_s: 5
    server:
      bind_host: 0.0.0.0
  tls:
    enabled: true
    cert_file: certs/server.pem
    key_file: certs/server-key.pem
    ca_file: certs/server.pem
