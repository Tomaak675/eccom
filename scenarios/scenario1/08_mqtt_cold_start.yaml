# scenario1: baseline latency (128 B random payload, 1 msg/s x 60 s).
# See 01_http.yaml.
# Identical traffic in every file; only the protocol block differs.
#
# Cold-start variant of 04_mqtt_qos1 and the MQTT counterpart of
# 07_http_no_keepalive: reconnect_per_message makes the sender connect,
# publish and disconnect for every message. The connect sits inside the
# measured SEND_STARTED -> SEND_COMPLETED interval, so send-ack prices the
# full session setup (TCP handshake + CONNECT/CONNACK + PUBLISH/PUBACK):
# what a duty-cycled sensor that sleeps between readings pays.
#
# clean_start: true makes every message a genuinely cold session; set it
# false to have the broker resume the previous session instead.
name: s1_mqtt_cold_start
interaction: one_way

topology:
  sender: edge
  receiver: cloud

payload:
  size_bytes: 128
  content: random
  seed: 42

load:
  mode: constant_rate
  messages_per_second: 1
  duration_s: 60
  concurrency: 1

receiver:
  artificial_processing_delay_ms: 0
  control_port: 8081
  control_bind_host: 0.0.0.0

experiment:
  warmup_s: 5
  cooldown_s: 2

instrumentation:
  system_metrics: true
  system_metrics_interval_s: 1.0

protocol:
  type: mqtt
  mqtt:
    endpoint:
      host: cloud
      port: 1883
    client:
      qos: 1
      clean_start: true
      reconnect_per_message: true
      timeout_s: 5
