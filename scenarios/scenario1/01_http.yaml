# scenario1: baseline latency. 128 B random payload, 1 msg/s x 60 s, one
# send in flight: far below any capacity limit, so each file shows the
# per-message cost of its protocol mechanics (hops, acks, handshakes, TLS).
# Headline metrics: delivery and send-ack latency; the two request_response
# files (09, 10) report rtt instead.
# Identical traffic in every file; only the protocol block differs.
# Run the whole suite:
#   eccom run scenarios/scenario1 --hosts hosts/<your-hosts>.yaml
#
# HTTP baseline: plain HTTP over one keep-alive connection.
name: s1_http
interaction: one_way

topology:
  sender: edge
  receiver: cloud

payload:
  size_bytes: 128
  content: random
  seed: 42

load:
  mode: constant_rate
  messages_per_second: 1
  duration_s: 60
  concurrency: 1

receiver:
  artificial_processing_delay_ms: 0
  control_port: 8081
  control_bind_host: 0.0.0.0

experiment:
  warmup_s: 5
  cooldown_s: 2

instrumentation:
  system_metrics: true
  system_metrics_interval_s: 1.0

protocol:
  type: http
  http:
    endpoint:
      host: cloud
      port: 8080
    client:
      keep_alive: true
      timeout_s: 5
    server:
      bind_host: 0.0.0.0
