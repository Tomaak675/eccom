# scenario1: baseline latency (128 B random payload, 1 msg/s x 60 s).
# See 01_http.yaml.
# Identical traffic in every file; only the protocol block differs.
#
# Interaction variant of 01_http: every message waits for an application
# reply. The sender measures the round trip on its own monotonic clock
# (SEND_STARTED -> REPLY_RECEIVED), so the headline rtt carries no
# clock-offset uncertainty and cross-checks the cross-host delivery
# latencies of the one-way files.
#
# One-way HTTP already waits for the server's 204, sent on receipt while the
# handler runs asynchronously; here the receiver answers 200 after the
# handler completed. The gap against 01's send-ack is the price of coupling
# the ack to server-side processing, expected to be near zero with
# artificial_processing_delay_ms: 0. send_ack is blank (SEND_COMPLETED is
# recorded only on the one-way path); delivery is still computed, so 01 and
# 09 compare on the same metric.
name: s1_http_req_rsp
interaction: request_response

topology:
  sender: edge
  receiver: cloud

payload:
  size_bytes: 128
  content: random
  seed: 42

load:
  mode: constant_rate
  messages_per_second: 1
  duration_s: 60
  concurrency: 1

receiver:
  artificial_processing_delay_ms: 0
  control_port: 8081
  control_bind_host: 0.0.0.0

experiment:
  warmup_s: 5
  cooldown_s: 2

instrumentation:
  system_metrics: true
  system_metrics_interval_s: 1.0

protocol:
  type: http
  http:
    endpoint:
      host: cloud
      port: 8080
    client:
      keep_alive: true
      timeout_s: 5
    server:
      bind_host: 0.0.0.0
