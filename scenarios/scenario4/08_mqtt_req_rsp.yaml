# scenario4: throughput ceiling with six sender processes and the Go
# receiver under a linear ramp (1800 msg/s +600 per 10 s step, 24 steps to
# 15600 msg/s with a 10 s drain pause between them, 32 B random payload,
# 10 000 in flight).
# See 01_http.yaml.
# Identical traffic in every file; only the protocol block differs.
#
# Interaction variant of 04_mqtt_qos1 and the MQTT counterpart of
# 07_http_req_rsp: every message waits for an application reply, so the
# headline is the round trip on the sender's clock (no clock-offset
# uncertainty). The reply is a second publish through the broker, which runs
# on the receiver's host, so the floor is two WAN legs plus a local relay (see
# scenario1 10); the broker relays twice per message and the receiver's
# reply publishes share its connection window with the requests. Against 04
# this shows what a correlated reply costs once the broker and receiver are
# busy; against 07 whether the broker relay moves the ceiling.
#
# Both agents read the same client block, so max_inflight_messages: 10000
# bounds the receiver's reply publishes as well as the sender's requests
# (paho queues locally past it, see 04_mqtt_qos1.yaml); the broker limits are
# lifted so backlog shows up as latency rather than as drops.
name: s4_mqtt_req_rsp
interaction: request_response

topology:
  sender: edge
  receiver: cloud

payload:
  size_bytes: 32
  content: random
  seed: 42

load:
  mode: ramp
  messages_per_second: 1800    # first step: 300 msg/s per sender process
  rate_increment: 600          # +100 msg/s per sender process per step (linear ramp)
  step_duration_s: 10
  step_pause_s: 10             # quiet gap after every step: the backlog drains, the next step starts empty
  duration_s: 240              # 24 steps of sending: 1800 -> 15600 msg/s
  concurrency: 10000           # ~1667 per sender process: sized so it never limits the schedule
  senders: 6                   # one per core of the sender's host; leave some free for the kernel, dockerd and sshd

receiver:
  artificial_processing_delay_ms: 0
  control_port: 8081
  control_bind_host: 0.0.0.0
  implementation: go           # a Python receiver is one event loop on one core; Go uses every core

experiment:
  warmup_s: 5
  cooldown_s: 10

instrumentation:
  system_metrics: true
  system_metrics_interval_s: 1.0
  link_capacity: true          # iperf3 both ways before the run: the uplink's capacity

protocol:
  type: mqtt
  tcp_nodelay: true           # Nagle off on every socket (the default; explicit so the run records it)
  mqtt:
    endpoint:
      host: cloud
      port: 1883
    client:
      qos: 1
      timeout_s: 5
      max_inflight_messages: 10000
    broker:
      max_inflight_messages: 10000   # = the client's window; mosquitto 2.1 turns 0 into a quota of 20 plus a warning per publish
      max_queued_messages: 0
